name: Android signed release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release.yml
permissions:
  contents: read
concurrency:
  group: lhs-release
  cancel-in-progress: false
jobs:
  release:
    # Allow this one release push from the reviewed baseline, then use manual dispatch.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.before == 'a04a22b3d6fe9032a6fb1663097ed90f1b91d621')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing configuration
        shell: bash
        env:
          KEYSTORE: ${{ secrets.LHS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LHS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LHS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LHS_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Required signing secret missing: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/lhs-release.jks"
      - name: Test and build signed APK
        env:
          LHS_KEYSTORE_PATH: ${{ runner.temp }}/lhs-release.jks
          LHS_KEYSTORE_PASSWORD: ${{ secrets.LHS_KEYSTORE_PASSWORD }}
          LHS_KEY_ALIAS: ${{ secrets.LHS_KEY_ALIAS }}
          LHS_KEY_PASSWORD: ${{ secrets.LHS_KEY_PASSWORD }}
        run: bash gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LHS-Papua-1.2.3-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test native input on Android emulator
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          export ANDROID_USER_HOME="$RUNNER_TEMP/lhs-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-34;default;x86_64"
          sdkmanager --install emulator "$image"
          printf 'no\n' | avdmanager create avd --force --name lhs-test --package "$image" --device pixel_2 --path "$ANDROID_AVD_HOME/lhs-test.avd"
          test -s "$ANDROID_AVD_HOME/lhs-test.avd/config.ini"
          if [ ! -f "$ANDROID_AVD_HOME/lhs-test.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-34\n' "$ANDROID_AVD_HOME/lhs-test.avd" > "$ANDROID_AVD_HOME/lhs-test.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx lhs-test
          "$ANDROID_HOME/emulator/emulator" -avd lhs-test -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/lhs-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 bash -c 'until adb get-state 2>/dev/null | grep -qx device; do kill -0 "$1" 2>/dev/null || exit 1; sleep 2; done' bash "$emulator_pid" || { cat "$RUNNER_TEMP/lhs-emulator.log"; exit 1; }
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done' || { cat "$RUNNER_TEMP/lhs-emulator.log"; exit 1; }
          adb shell settings put global device_provisioned 1
          adb shell settings put secure user_setup_complete 1
          adb shell settings put global hide_error_dialogs 1
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell wm size 720x1280
          adb shell wm density 320
          timeout 60 bash -c 'until adb shell ime list -s | tr -d "\r" | grep -q latin; do sleep 2; done'
          ime="$(adb shell ime list -s | tr -d '\r' | awk '/latin/ {print; exit}')"
          adb shell ime enable "$ime"
          adb shell ime set "$ime"
          bash gradlew --no-daemon connectedDebugAndroidTest || {
            adb shell dumpsys window > "$RUNNER_TEMP/lhs-window.log"
            adb logcat -d -t 1800 > "$RUNNER_TEMP/lhs-device.log"
            exit 1
          }
      - name: Upload test reports and UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHS-test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/verification/
            app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/lhs-emulator.log
            ${{ runner.temp }}/lhs-window.log
            ${{ runner.temp }}/lhs-device.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/lhs-release.jks"
